version: '3.8'

services:
  # Laravel Backend API (Production Mode)
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-laravel
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:your-32-character-secret-key-here
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_tools
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_strong_password_2024
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
    networks:
      - ai-tools-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Next.js Frontend (Production Mode)
  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-nextjs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - ai-tools-network
    depends_on:
      - laravel-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai-tools-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_strong_password_2024
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_strong_password_2024
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/supabase-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ai-tools-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-p$$MYSQL_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: ai-tools-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ai-tools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Web Server & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-tools-nginx
    restart: unless-stopped
    ports:
      - "3000:80"    # Frontend accessible at localhost:3000
      - "8000:8080"  # API accessible at localhost:8000
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai-tools-network
    depends_on:
      - laravel-app
      - nextjs-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Laravel Queue Worker
  laravel-queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-queue
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_tools
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_strong_password_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    networks:
      - ai-tools-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Scheduler (Cron Jobs)  
  laravel-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-scheduler
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_tools
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_strong_password_2024
    command: |
      sh -c 'echo "* * * * * cd /var/www/html && php artisan schedule:run >> /var/log/cron.log 2>&1" | crontab - && crond -f -l 2'
    networks:
      - ai-tools-network
    depends_on:
      mysql:
        condition: service_healthy

# Named Volumes for Data Persistence
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# Custom Network
networks:
  ai-tools-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16