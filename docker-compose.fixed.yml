version: '3.8'

services:
  # Next.js Frontend (Fixed Permissions)
  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-nextjs-fixed
    restart: unless-stopped
    user: "1001:1001"  # nextjs user
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://nginx/api
      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - ai-tools-network
    depends_on:
      - laravel-app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Laravel Backend (Fixed Permissions)
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-tools-laravel-fixed
    restart: unless-stopped
    user: "1000:1000"  # www-data user
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:Qwl0AZC06Fpx+Vpt2wbptDsU+O1pnvwN5ppLLUZbVfY=
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_tools
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_strong_password_2024
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ai-tools-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai-tools-mysql-fixed
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_strong_password_2024
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_strong_password_2024
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ai-tools-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-p$$MYSQL_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: ai-tools-redis-fixed
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - ai-tools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Web Server & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-tools-nginx-fixed
    restart: unless-stopped
    ports:
      - "3000:80"    # Frontend accessible at localhost:3000
      - "8000:8080"  # API accessible at localhost:8000
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai-tools-network
    depends_on:
      - laravel-app
      - nextjs-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named Volumes for Data Persistence
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# Custom Network
networks:
  ai-tools-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16