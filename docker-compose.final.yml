version: '3.8'

services:
  # Laravel Backend API (SQLite for simplicity)
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai-tools-laravel-final
    restart: unless-stopped
    environment:
      - APP_NAME=AI Tools Management
      - APP_ENV=local
      - APP_KEY=base64:Qwl0AZC06Fpx+Vpt2wbptDsU+O1pnvwN5ppLLUZbVfY=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - CACHE_DRIVER=array
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - ai-tools-network
    volumes:
      - ./backend/.env.docker:/var/www/html/.env:ro
    ports:
      - "8000:80"
    command: >
      sh -c "
        touch /var/www/html/database/database.sqlite &&
        chmod 664 /var/www/html/database/database.sqlite &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        supervisord -c /etc/supervisor/conf.d/supervisord.conf
      "

  # Next.js Frontend
  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ai-tools-nextjs-final
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - ai-tools-network
    ports:
      - "3000:3000"
    depends_on:
      - laravel-app
    command: npm run dev

# Networks
networks:
  ai-tools-network:
    driver: bridge