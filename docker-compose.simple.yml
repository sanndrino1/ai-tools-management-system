version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ai-tools-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_strong_password_2024
      MYSQL_DATABASE: ai_tools
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_strong_password_2024
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ai-tools-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-tools-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-tools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
      target: development
    container_name: ai-tools-laravel
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_tools
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_strong_password_2024
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:80"
    networks:
      - ai-tools-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health || echo 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Next.js Frontend
  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.simple
      target: development
    container_name: ai-tools-nextjs
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports:
      - "3000:3000"
    networks:
      - ai-tools-network
    depends_on:
      - laravel-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || echo 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# Named Volumes
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# Custom Network
networks:
  ai-tools-network:
    driver: bridge