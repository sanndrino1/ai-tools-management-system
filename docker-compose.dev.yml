version: '3.8'

services:
  # Laravel Backend API (Development Mode with SQLite)
  laravel-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai-tools-laravel-dev
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:Qwl0AZC06Fpx+Vpt2wbptDsU+O1pnvwN5ppLLUZbVfY=
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - CACHE_DRIVER=array
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    networks:
      - ai-tools-network
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
      - ./backend/database:/var/www/html/database
      - ./backend/storage:/var/www/html/storage
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js Frontend (Development Mode)
  nextjs-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ai-tools-nextjs-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - ai-tools-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - laravel-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Networks
networks:
  ai-tools-network:
    driver: bridge